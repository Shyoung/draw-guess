<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a6b"/>
      <stop offset="0.55" stop-color="#ff7a59"/>
      <stop offset="1" stop-color="#ff5d7a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#8a2a1c" flood-opacity="0.28"/>
    </filter>
    <clipPath id="clip"><rect width="512" height="512"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- 배경 장식 -->
    <circle cx="438" cy="84" r="46" fill="#ffffff" opacity="0.12"/>
    <circle cx="62" cy="452" r="64" fill="#ffffff" opacity="0.10"/>

    <!-- 말풍선(그림판) -->
    <path filter="url(#shadow)" fill="#ffffff"
      d="M124 88 H356 A52 52 0 0 1 408 140 V300 A52 52 0 0 1 356 352 H210 L140 414 L150 352 H124 A52 52 0 0 1 72 300 V140 A52 52 0 0 1 124 88 Z"/>

    <!-- 그린 선 -->
    <path d="M118 270 C 150 176, 198 172, 226 236 S 296 300, 326 214"
      fill="none" stroke="#5b8def" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 물음표 -->
    <text x="340" y="176" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="92" fill="#ffd166" stroke="#f0b428" stroke-width="3">?</text>

    <!-- 연필 (끝이 선의 끝에 닿도록) -->
    <g transform="translate(326 214) rotate(40) scale(0.72)">
      <polygon points="0,0 72,-34 72,34" fill="#f6c99b"/>
      <polygon points="0,0 27,-12.8 27,12.8" fill="#2b2d42"/>
      <rect x="72" y="-34" width="176" height="68" fill="#ffd166"/>
      <rect x="72" y="-34" width="176" height="14" fill="#ffe29a"/>
      <rect x="72" y="12" width="176" height="22" fill="#f4b528"/>
      <rect x="248" y="-34" width="32" height="68" fill="#c7cad6"/>
      <rect x="256" y="-34" width="4" height="68" fill="#a9adbd"/>
      <rect x="268" y="-34" width="4" height="68" fill="#a9adbd"/>
      <path d="M280 -34 H306 A18 18 0 0 1 324 -16 V16 A18 18 0 0 1 306 34 H280 Z" fill="#ff8fa3"/>
    </g>

    <!-- 반짝이 -->
    <path d="M430 196 l9 22 22 9 -22 9 -9 22 -9 -22 -22 -9 22 -9 z" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
